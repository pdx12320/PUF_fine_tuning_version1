<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">AI-guided RNA-editing candidate prioritization</title>
  <desc id="desc">A 101-nucleotide RNA sequence is represented by pretrained LAMAR, adapted with LoRA, ranked as an editing candidate, and passed to future PUF-APOBEC experimental validation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2FBFA"/>
      <stop offset="1" stop-color="#F5F2FF"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="600" rx="32" fill="url(#background)"/>
  <text x="800" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14213D">AI-guided prioritization before wet-lab testing</text>
  <text x="800" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Sequence evidence narrows the experimental search space</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="55" y="190" width="250" height="220" rx="24" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <text x="180" y="244" text-anchor="middle" font-size="25" font-weight="700" fill="#1E3A8A">RNA sequence</text>
    <text x="180" y="284" text-anchor="middle" font-size="18" fill="#475569">101 nt context</text>
    <text x="180" y="326" text-anchor="middle" font-size="18" fill="#334155">... A U G <tspan fill="#BE123C" font-weight="700">C</tspan> A C U ...</text>
    <text x="180" y="365" text-anchor="middle" font-size="16" fill="#64748B">candidate center C</text>

    <rect x="365" y="190" width="250" height="220" rx="24" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <text x="490" y="244" text-anchor="middle" font-size="25" font-weight="700" fill="#115E59">LAMAR</text>
    <text x="490" y="284" text-anchor="middle" font-size="18" fill="#475569">pretrained RNA</text>
    <text x="490" y="314" text-anchor="middle" font-size="18" fill="#475569">representation</text>
    <text x="490" y="365" text-anchor="middle" font-size="16" fill="#64748B">sequence context</text>

    <rect x="675" y="190" width="250" height="220" rx="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <text x="800" y="244" text-anchor="middle" font-size="25" font-weight="700" fill="#5B21B6">LoRA adaptation</text>
    <text x="800" y="284" text-anchor="middle" font-size="18" fill="#475569">task-specific</text>
    <text x="800" y="314" text-anchor="middle" font-size="18" fill="#475569">editing signal</text>
    <text x="800" y="365" text-anchor="middle" font-size="16" fill="#64748B">297,217 parameters</text>

    <rect x="985" y="190" width="250" height="220" rx="24" fill="#FFFFFF" stroke="#D97706" stroke-width="4"/>
    <text x="1110" y="244" text-anchor="middle" font-size="25" font-weight="700" fill="#92400E">Candidate ranking</text>
    <text x="1110" y="284" text-anchor="middle" font-size="18" fill="#475569">prioritized sites</text>
    <text x="1110" y="314" text-anchor="middle" font-size="18" fill="#475569">under an FP budget</text>
    <text x="1110" y="365" text-anchor="middle" font-size="16" fill="#64748B">screening output</text>

    <rect x="1295" y="190" width="250" height="220" rx="24" fill="#FFFFFF" stroke="#BE123C" stroke-width="4" stroke-dasharray="12 9"/>
    <text x="1420" y="244" text-anchor="middle" font-size="24" font-weight="700" fill="#9F1239">PUF-APOBEC</text>
    <text x="1420" y="278" text-anchor="middle" font-size="24" font-weight="700" fill="#9F1239">validation</text>
    <text x="1420" y="324" text-anchor="middle" font-size="18" fill="#475569">wet-lab testing</text>
    <text x="1420" y="365" text-anchor="middle" font-size="16" fill="#9F1239">next experimental step</text>
  </g>

  <g stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M315 300 H350"/>
    <path d="M625 300 H660"/>
    <path d="M935 300 H970"/>
    <path d="M1245 300 H1280" stroke-dasharray="9 8"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="510" y="474" width="580" height="58" rx="29" fill="#E2F4F1"/>
    <text x="800" y="511" text-anchor="middle" font-size="19" font-weight="700" fill="#115E59">The model prioritizes experiments; it does not replace them.</text>
  </g>
</svg>
