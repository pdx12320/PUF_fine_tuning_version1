<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Locked-test average precision across five sequence models</title>
  <desc id="desc">Horizontal bars compare locked-test average precision for k-mer logistic regression, a convolutional neural network, a frozen LAMAR head, full LAMAR fine-tuning, and LoRA LAMAR. LoRA LAMAR has the highest value at 0.171958.</desc>
  <rect width="1400" height="760" rx="30" fill="#F8FAFC"/>

  <g font-family="Arial, sans-serif">
    <text x="700" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#14213D">LAMAR adaptation improves candidate ranking</text>
    <text x="700" y="94" text-anchor="middle" font-size="19" fill="#475569">Locked test: 161 computational positives and 161,000 strict computational negatives</text>

    <g stroke="#CBD5E1" stroke-width="2">
      <line x1="340" y1="130" x2="340" y2="650"/>
      <line x1="601.1" y1="130" x2="601.1" y2="650"/>
      <line x1="862.2" y1="130" x2="862.2" y2="650"/>
      <line x1="1123.3" y1="130" x2="1123.3" y2="650"/>
      <line x1="1280" y1="130" x2="1280" y2="650"/>
    </g>

    <g fill="#64748B" font-size="16" text-anchor="middle">
      <text x="340" y="682">0</text>
      <text x="601.1" y="682">0.05</text>
      <text x="862.2" y="682">0.10</text>
      <text x="1123.3" y="682">0.15</text>
      <text x="1280" y="682">0.18</text>
      <text x="810" y="724" font-size="18">Locked-test average precision</text>
    </g>

    <g fill="#334155" font-size="20" text-anchor="end">
      <text x="315" y="204">k-mer</text>
      <text x="315" y="304">CNN</text>
      <text x="315" y="404">Frozen LAMAR</text>
      <text x="315" y="504">Full fine-tuning</text>
      <text x="315" y="604" font-weight="700" fill="#115E59">LoRA LAMAR</text>
    </g>

    <rect x="340" y="160" width="34.5" height="58" rx="10" fill="#94A3B8"/>
    <rect x="340" y="260" width="72.7" height="58" rx="10" fill="#94A3B8"/>
    <rect x="340" y="360" width="336.3" height="58" rx="10" fill="#64748B"/>
    <rect x="340" y="460" width="502.7" height="58" rx="10" fill="#64748B"/>
    <rect x="340" y="560" width="897.6" height="58" rx="10" fill="#0F766E"/>

    <g fill="#334155" font-size="20" font-weight="700">
      <text x="390" y="198">0.006598</text>
      <text x="428" y="298">0.013912</text>
      <text x="692" y="398">0.064390</text>
      <text x="858" y="498">0.096254</text>
      <text x="1254" y="598" fill="#115E59">0.171958</text>
    </g>

    <rect x="986" y="626" width="294" height="50" rx="25" fill="#DDF4EF"/>
    <text x="1133" y="658" text-anchor="middle" font-size="17" font-weight="700" fill="#115E59">Best locked-test AP</text>
  </g>
</svg>
