<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc">
  <title id="title">Future integration for programmable RNA-editing design</title>
  <desc id="desc">A proposed future workflow scans transcriptomic cytosines, ranks them with LAMAR, evaluates PUF binding compatibility, filters potential off-targets, and produces RNA-editor designs for experimental testing.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2FBFA"/>
      <stop offset="1" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.11"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1600" height="590" rx="32" fill="url(#background)"/>
  <text x="800" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#14213D">Future integration for programmable RNA-editing design</text>
  <rect x="625" y="84" width="350" height="44" rx="22" fill="#FFF1D6"/>
  <text x="800" y="113" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#92400E">PROPOSED WORKFLOW, NOT YET COMPLETED</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="45" y="200" width="215" height="190" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <text x="152" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#1E3A8A">Transcriptome</text>
    <text x="152" y="306" text-anchor="middle" font-size="17" fill="#475569">target RNA</text>
    <text x="152" y="335" text-anchor="middle" font-size="17" fill="#475569">sequence space</text>

    <rect x="305" y="200" width="215" height="190" rx="22" fill="#FFFFFF" stroke="#2563EB" stroke-width="4"/>
    <text x="412" y="248" text-anchor="middle" font-size="23" font-weight="700" fill="#1E3A8A">All cytosine</text>
    <text x="412" y="280" text-anchor="middle" font-size="23" font-weight="700" fill="#1E3A8A">scanning</text>
    <text x="412" y="326" text-anchor="middle" font-size="17" fill="#475569">101 nt contexts</text>

    <rect x="565" y="200" width="215" height="190" rx="22" fill="#FFFFFF" stroke="#0F766E" stroke-width="4"/>
    <text x="672" y="260" text-anchor="middle" font-size="24" font-weight="700" fill="#115E59">LAMAR</text>
    <text x="672" y="292" text-anchor="middle" font-size="24" font-weight="700" fill="#115E59">ranking</text>
    <text x="672" y="338" text-anchor="middle" font-size="17" fill="#475569">sequence priority</text>

    <rect x="825" y="200" width="215" height="190" rx="22" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4" stroke-dasharray="12 9"/>
    <text x="932" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#5B21B6">PUF binding</text>
    <text x="932" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#5B21B6">compatibility</text>
    <text x="932" y="326" text-anchor="middle" font-size="17" fill="#475569">future integration</text>

    <rect x="1085" y="200" width="215" height="190" rx="22" fill="#FFFFFF" stroke="#D97706" stroke-width="4" stroke-dasharray="12 9"/>
    <text x="1192" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#92400E">Off-target</text>
    <text x="1192" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#92400E">filtering</text>
    <text x="1192" y="326" text-anchor="middle" font-size="17" fill="#475569">future integration</text>

    <rect x="1345" y="200" width="215" height="190" rx="22" fill="#FFFFFF" stroke="#BE123C" stroke-width="4" stroke-dasharray="12 9"/>
    <text x="1452" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#9F1239">RNA editor</text>
    <text x="1452" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#9F1239">design</text>
    <text x="1452" y="326" text-anchor="middle" font-size="17" fill="#475569">experimental testing</text>
  </g>

  <g stroke="#64748B" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M270 295 H290"/>
    <path d="M530 295 H550"/>
    <path d="M790 295 H810" stroke-dasharray="9 8"/>
    <path d="M1050 295 H1070" stroke-dasharray="9 8"/>
    <path d="M1310 295 H1330" stroke-dasharray="9 8"/>
  </g>

  <text x="800" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">Current contribution: sequence ranking with LAMAR</text>
  <text x="800" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#92400E">Future integration: PUF compatibility, off-target analysis and editor design</text>
</svg>
