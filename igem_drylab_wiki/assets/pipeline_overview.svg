<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">LAMAR C-editing dry-lab workflow</title>
  <desc id="desc">Six RNA-seq BAMs are recounted to construct computational labels, grouped into leakage-safe splits, used for model comparison, calibrated, and evaluated once on locked test.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f6f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#334155" flood-opacity="0.15"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1600" height="520" rx="28" fill="url(#bg)"/>
  <text x="800" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Leakage-controlled sequence discovery workflow</text>
  <g font-family="Arial, sans-serif" filter="url(#shadow)">
    <rect x="55" y="145" width="245" height="225" rx="22" fill="#ffffff" stroke="#4c78a8" stroke-width="4"/>
    <text x="177" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#24476b">Six RNA-seq BAMs</text>
    <text x="177" y="240" text-anchor="middle" font-size="19" fill="#334155">T1 · T2 · T3</text>
    <text x="177" y="270" text-anchor="middle" font-size="19" fill="#334155">C1 · C2 · C3</text>
    <text x="177" y="315" text-anchor="middle" font-size="18" fill="#64748b">Unified pileup rules</text>
    <text x="177" y="344" text-anchor="middle" font-size="18" fill="#64748b">MAPQ 30 · BQ 20</text>

    <rect x="370" y="125" width="265" height="265" rx="22" fill="#ffffff" stroke="#54a24b" stroke-width="4"/>
    <text x="502" y="175" text-anchor="middle" font-size="25" font-weight="700" fill="#28613c">Computational labels</text>
    <text x="502" y="220" text-anchor="middle" font-size="19" fill="#334155">1,513 positives</text>
    <text x="502" y="252" text-anchor="middle" font-size="19" fill="#334155">2,821,734 strict negatives</text>
    <text x="502" y="300" text-anchor="middle" font-size="18" fill="#64748b">WGS + sequence QC</text>
    <text x="502" y="330" text-anchor="middle" font-size="18" fill="#64748b">All-six zero-alt negatives</text>
    <text x="502" y="360" text-anchor="middle" font-size="18" fill="#64748b">101 nt · center C</text>

    <rect x="705" y="145" width="250" height="225" rx="22" fill="#ffffff" stroke="#f58518" stroke-width="4"/>
    <text x="830" y="195" text-anchor="middle" font-size="25" font-weight="700" fill="#8a470d">Leakage grouping</text>
    <text x="830" y="238" text-anchor="middle" font-size="18" fill="#334155">gene · locus</text>
    <text x="830" y="270" text-anchor="middle" font-size="18" fill="#334155">overlapping window</text>
    <text x="830" y="302" text-anchor="middle" font-size="18" fill="#334155">exact sequence</text>
    <text x="830" y="342" text-anchor="middle" font-size="18" fill="#64748b">70 / 10 / 10 / 10</text>

    <rect x="1025" y="125" width="250" height="265" rx="22" fill="#ffffff" stroke="#b279a2" stroke-width="4"/>
    <text x="1150" y="175" text-anchor="middle" font-size="25" font-weight="700" fill="#70446b">Model study</text>
    <text x="1150" y="220" text-anchor="middle" font-size="18" fill="#334155">k-mer · CNN</text>
    <text x="1150" y="252" text-anchor="middle" font-size="18" fill="#334155">Frozen · Partial</text>
    <text x="1150" y="284" text-anchor="middle" font-size="18" fill="#334155">LoRA · Full</text>
    <text x="1150" y="330" text-anchor="middle" font-size="18" fill="#64748b">Dev-only selection</text>
    <text x="1150" y="360" text-anchor="middle" font-size="18" fill="#64748b">1:1000 calibration</text>

    <rect x="1345" y="145" width="205" height="225" rx="22" fill="#ffffff" stroke="#e45756" stroke-width="4"/>
    <text x="1447" y="195" text-anchor="middle" font-size="24" font-weight="700" fill="#8a2f35">Locked test</text>
    <text x="1447" y="240" text-anchor="middle" font-size="19" fill="#334155">161 : 161,000</text>
    <text x="1447" y="285" text-anchor="middle" font-size="18" fill="#64748b">One frozen suite</text>
    <text x="1447" y="320" text-anchor="middle" font-size="18" fill="#64748b">AP 0.171958</text>
  </g>
  <g stroke="#475569" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M305 258 H355"/>
    <path d="M640 258 H690"/>
    <path d="M960 258 H1010"/>
    <path d="M1280 258 H1330"/>
  </g>
  <text x="800" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#475569">All labels are computational; predictions prioritize candidates for experimental follow-up.</text>
</svg>
